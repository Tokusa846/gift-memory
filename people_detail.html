<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>人物詳細 | Gift Memory</title>


  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- CSS -->
  <link rel="stylesheet" href="CSS/common.css">
  <link rel="stylesheet" href="CSS/people_detail.css">

</head>


<body>

  <div class="app-container">


    <!-- ==================================================
         HEADER
    =================================================== -->
    <header class="person-detail-header">

      <a
        href="people_manage.html"
        class="person-detail-back"
        aria-label="人物一覧へ戻る"
      >

        <i class="fa-solid fa-chevron-left"></i>

      </a>


      <h1>
        人物詳細
      </h1>

      <div class="person-detail-header-spacer"></div>

    </header>


     <!-- ==================================================
         MAIN
    =================================================== -->
    <main class="person-detail-main">

      <!-- MAIN_LOADING -->
      <div
        id="personDetailLoading"
        class="person-detail-loading"
      >

        人物情報を読み込んでいます...

      </div>

      <!-- MAIN_DETAIL -->
      <div
        id="personDetailContent"
        class="hidden"
      >


        <!-- ===============================================
             MAIN_DETAIL_PROFILE
        ================================================ -->
        <section class="person-detail-profile">

          <div
            id="detailAvatar"
            class="person-detail-avatar"
          >
            ?
          </div>


          <div class="person-detail-name-row">
            
            <h2 id="detailName">
              -
            </h2>
            
            <button
              type="button"
              id="basicInfoEditButton"
              class="person-section-edit-button"
              aria-label="基本情報を編集"
            >
            
              <i class="fa-solid fa-pencil"></i>
            
            </button>
          
          </div>


          <p
            id="detailBirthday"
            class="person-detail-birthday"
          >
            -
          </p>


          <span
            id="detailRelationship"
            class="person-detail-relationship"
          >
            -
          </span>

        </section>


        <!-- ===============================================
             MAIN_DETAIL_GIFT HISTORY
        ================================================ -->
        <section class="person-detail-section">

          <div class="person-detail-section-title">

            <h3>
              プレゼント
            </h3>

            <a
              id="giftAddButton"
              href="#"
              class="person-section-add-button"
              aria-label="プレゼントを追加"
            >
              <i class="fa-solid fa-plus"></i>
            </a>

          </div>


          <div class="person-detail-counts">

            <div class="person-detail-count received">

              <span>もらった</span>

              <strong id="detailReceivedCount">
                0
              </strong>

            </div>


            <div class="person-detail-count given">

              <span>あげた</span>

              <strong id="detailGivenCount">
                0
              </strong>

            </div>

          </div>


          <div
            id="detailGiftList"
            class="person-detail-gift-list"
          >
          </div>

        </section>


        <!-- ===============================================
          MAIN_DETAIL_PROFILE INFORMATION
        ================================================ -->
        <section class="person-detail-section">

          <div class="person-detail-section-title person-detail-section-title-row">

            <h3>
              好み・情報
            </h3>

            <button
              type="button"
              id="preferenceEditButton"
              class="person-section-edit-button"
              aria-label="好み・情報を編集"
            >
              <i class="fa-solid fa-pencil"></i>
            </button>

          </div>


          <!-- LIKES -->
          <div class="person-info-row">

            <div class="person-info-icon likes">
              <i class="fa-regular fa-heart"></i>
            </div>

            <div class="person-info-content">

              <span class="person-info-label">
                好きなもの
              </span>

              <p id="detailLikes">
                -
              </p>

            </div>

          </div>


          <!-- DISLIKES -->
          <div class="person-info-row">

            <div class="person-info-icon dislikes">
              <i class="fa-solid fa-minus"></i>
            </div>

            <div class="person-info-content">

              <span class="person-info-label">
                苦手なもの
              </span>

              <p id="detailDislikes">
                -
              </p>

            </div>

          </div>


          <!-- ALLERGIES -->
          <div class="person-info-row">

            <div class="person-info-icon allergies">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <div class="person-info-content">

              <span class="person-info-label">
                アレルギー情報
              </span>

              <p id="detailAllergies">
                -
              </p>

            </div>

          </div>

        </section>


        <!-- ===============================================
             MAIN_DETAIL_MEMO
        ================================================ -->
        <section class="person-detail-section">

          <div class="person-detail-section-title">

            <h3>
              メモ
            </h3>

            <button
              type="button"
              id="memoAddButton"
              class="person-section-add-button"
              aria-label="メモを追加"
            >
              <i class="fa-solid fa-plus"></i>
            </button>

          </div>


          <div
            id="detailMemoList"
            class="person-detail-memo-list"
          >
          </div>

        </section>

      </div>


      <!-- MAIN_ERROR -->
      <div
        id="personDetailError"
        class="person-detail-error hidden"
      >

        <i class="fa-regular fa-circle-xmark"></i>

        <p>
          人物情報を取得できませんでした。
        </p>

        <a href="people_manage.html">
          人物一覧へ戻る
        </a>

      </div>

    </main>


    <!-- ===============================================
         BOTTOM NAVIGATION
    ================================================ -->
    <nav class="bottom-nav">
      <a
        href="index.html"
        class="nav-link-button"
      >

        <i class="fa-solid fa-house"></i>

        <span>ホーム</span>

      </a>

      <a
        href="people_manage.html"
        class="nav-link-button active-tab"
      >

        <i class="fa-solid fa-user"></i>

        <span>人物</span>

      </a>

      <button
        class="nav-button"
        type="button"
        disabled
      >

        <i class="fa-regular fa-calendar"></i>

        <span>予定</span>

      </button>

      <button
        class="nav-button"
        type="button"
        disabled
      >

        <i class="fa-solid fa-wand-magic-sparkles"></i>

        <span>AI</span>

      </button>

      <button
        class="nav-button"
        type="button"
        disabled
      >

        <i class="fa-solid fa-gear"></i>

        <span>設定</span>

      </button>

    </nav>

    <!-- ===============================================
          PREFERENCE EDIT MODAL
    ================================================ -->
    <div
      id="preferenceEditModal"
      class="person-edit-overlay hidden"
      aria-hidden="true"
    >

      <div
        class="person-edit-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="preferenceEditTitle"
      >

        <!-- HEADER -->
        <div class="person-edit-modal-header">

          <h2 id="preferenceEditTitle">
            好み・情報を編集
          </h2>

          <button
            type="button"
            id="preferenceEditClose"
            class="person-edit-modal-close"
            aria-label="閉じる"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>


        <!-- FORM -->
        <form id="preferenceEditForm">


          <!-- =========================
               LIKES
          ========================== -->
          <div class="person-edit-form-group">

            <label for="preferenceEditLikes">
              好きなもの
            </label>

            <textarea
              id="preferenceEditLikes"
              rows="3"
              placeholder="例：コーヒー、読書、甘いもの"
            ></textarea>

          </div>


          <!-- =========================
               DISLIKES
          ========================== -->
          <div class="person-edit-form-group">

            <label for="preferenceEditDislikes">
              苦手なもの
            </label>

            <textarea
              id="preferenceEditDislikes"
              rows="3"
              placeholder="例：香りの強いもの"
            ></textarea>

          </div>


          <!-- =========================
               ALLERGIES
          ========================== -->
          <div class="person-edit-form-group">

            <label>
              アレルギー情報
            </label>

            <div class="allergy-checkbox-grid">


              <!-- 卵 -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="卵"
                >

                <span>
                  卵
                </span>

              </label>


              <!-- 乳 -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="乳"
                >

                <span>
                  乳
                </span>

              </label>


              <!-- 小麦 -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="小麦"
                >

                <span>
                  小麦
                </span>

              </label>


              <!-- えび -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="えび"
                >

                <span>
                  えび
                </span>

              </label>


              <!-- かに -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="かに"
                >

                <span>
                  かに
                </span>

              </label>


              <!-- そば -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="そば"
                >

                <span>
                  そば
                </span>

              </label>


              <!-- 落花生 -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="落花生"
                >

                <span>
                  落花生
                </span>

              </label>


              <!-- くるみ -->
              <label class="allergy-checkbox-item">

                <input
                  type="checkbox"
                  value="くるみ"
                >

                <span>
                  くるみ
                </span>

              </label>


            </div>

          </div>


          <!-- =========================
               OTHER ALLERGY
          ========================== -->
          <div class="person-edit-form-group">

            <label for="preferenceEditAllergyOther">
              その他のアレルギー
            </label>

            <input
              type="text"
              id="preferenceEditAllergyOther"
              placeholder="例：キウイ、桃"
            >

          </div>


          <!-- =========================
               MESSAGE
          ========================== -->
          <p
            id="preferenceEditMessage"
            class="person-edit-message"
          ></p>


          <!-- =========================
               ACTION BUTTONS
          ========================== -->
          <div class="person-edit-actions">

            <button
              type="button"
              id="preferenceEditCancel"
              class="person-edit-cancel-button"
            >
              キャンセル
            </button>

            <button
              type="submit"
              id="preferenceEditSave"
              class="person-edit-save-button"
            >
              保存
            </button>

          </div>


        </form>

      </div>

    </div>

    <!-- ------------------
     BASIC INFO EDIT MODAL
    -------------------- -->
    <div
      id="basicInfoEditModal"
      class="person-edit-overlay hidden"
      aria-hidden="true"
    >
    
      <div
        class="person-edit-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="basicInfoEditTitle"
      >
      
        <!-- HEADER -->
        <div class="person-edit-modal-header">
          <h2 id="basicInfoEditTitle">
            基本情報を編集
          </h2>

          <button
            type="button"
            id="basicInfoEditClose"
            class="person-edit-modal-close"
            aria-label="閉じる"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>


        <!-- FORM -->
        <form id="basicInfoEditForm">

          <!-- NAME -->
          <div class="person-edit-form-group">
            <label for="basicEditName">
                名前
            </label>

            <input
                type="text"
                id="basicEditName"
                required
            >
          </div>


          <!-- BIRTHDAY -->
          <div class="person-edit-form-group">
          <label for="basicEditBirthday">
              誕生日
           </label>

          <input
              type="date"
              id="basicEditBirthday"
            >
          </div>


          <!-- RELATIONSHIP -->
          <div class="person-edit-form-group">

            <label for="basicEditRelationship">
              関係値
            </label>

            <select id="basicEditRelationship">
              <option value="">
                未設定
              </option>

              <option value="家族">
                家族
              </option>

              <option value="友人">
                友人
              </option>

              <option value="職場">
                職場
              </option>

              <option value="親戚">
                親戚
              </option>

              <option value="その他">
                その他
              </option>

            </select>
          </div>


          <!-- MESSAGE -->
          <p
            id="basicInfoEditMessage"
            class="person-edit-message"
          ></p>


          <!-- BUTTONS -->
          <div class="person-edit-actions">
            <button
              type="button"
              id="basicInfoEditCancel"
              class="person-edit-cancel-button"
            >
              キャンセル
            </button>

            <button
              type="submit"
              id="basicInfoEditSave"
              class="person-edit-save-button"
            >
              保存
            </button>

          </div>


        </form>
      </div>
    </div>

    <!-- =========================
     MEMO ADD MODAL
    ========================== -->
    <div
      id="memoAddModal"
      class="person-edit-overlay hidden"
      aria-hidden="true"
    >

      <div
        class="person-edit-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memoAddTitle"
      >

        <div class="person-edit-modal-header">

          <h2 id="memoAddTitle">
            メモを追加
          </h2>

          <button
            type="button"
            id="memoAddClose"
            class="person-edit-modal-close"
            aria-label="閉じる"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>


        <form id="memoAddForm">

          <div class="person-edit-form-group">

            <label for="memoAddContent">
              メモ
            </label>

            <textarea
              id="memoAddContent"
              rows="5"
              placeholder="覚えておきたいことを入力"
              required
            ></textarea>

          </div>


          <p
            id="memoAddMessage"
            class="person-edit-message"
          ></p>


          <div class="person-edit-actions">

            <button
              type="button"
              id="memoAddCancel"
              class="person-edit-cancel-button"
            >
              キャンセル
            </button>

            <button
              type="submit"
              id="memoAddSave"
              class="person-edit-save-button"
            >
              追加
            </button>

          </div>

        </form>

      </div>

    </div>

    <!-- ↓ class_name = app-container -->
  </div>


  <script
    type="module"
    src="js/people_detail.js"
  ></script>

</body>

</html>
