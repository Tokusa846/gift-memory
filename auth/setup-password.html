<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初期パスワード設定 | Gift Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common/common.css">
  <link rel="stylesheet" href="./auth.css">
  <script type="module" src="./setup-password.js"></script>
</head>
<body>
  <div class="app-container auth-app">
    <main class="auth-main">
      <div class="auth-brand" aria-hidden="true">♡</div>
      <h1 class="auth-title">Gift Memory</h1>
      <p class="auth-subtitle">大切な人への想いを、忘れないために。</p>
      <section class="auth-card" aria-labelledby="setupHeading">
        <h2 id="setupHeading">初期パスワード設定</h2>
        <p class="auth-description">招待メールのリンクからアクセスした方は、新しいパスワードを設定してください。</p>
        <form id="setupPasswordForm">
          <label for="newPassword">新しいパスワード</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="8文字以上で入力">
          <label for="confirmPassword">パスワード（確認）</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="もう一度入力">
          <p id="setupPasswordMessage" class="auth-message" role="status" aria-live="polite">招待情報を確認しています...</p>
          <button id="setupPasswordButton" class="auth-primary-button" type="submit" disabled>パスワードを設定する</button>
        </form>
        <a class="auth-secondary-link" href="./login.html">ログイン画面へ戻る</a>
      </section>
      <p class="auth-note">招待リンクは他の人に共有しないでください。</p>
    </main>
  </div>
</body>
</html>
