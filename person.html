<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>人物登録 | Gift Memory</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="CSS/common.css">
  <link rel="stylesheet" href="CSS/person.css">
</head>

<body>

  <div class="app-container person-page">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="person-page-header">

      <a
        href="index.html"
        class="person-back-button"
        aria-label="TOPへ戻る"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </a>

      <h1>人物を登録</h1>

      <a
        href="index.html"
        class="person-close-button"
        aria-label="閉じる"
      >
        <i class="fa-solid fa-xmark"></i>
      </a>

    </header>


    <!-- =========================
         FORM
    ========================== -->
    <main class="person-form-area">

      <form id="person-form">

        <!-- 名前 -->
        <div class="person-form-group">

          <label
            for="name"
            class="person-form-label"
          >
            名前
            <span class="required-mark">必須</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="例: 田中、田中さん（敬称は任意）"
            required
          >

        </div>


        <!-- 誕生日 -->
        <div class="person-form-group">

          <label
            for="birthday"
            class="person-form-label"
          >
            誕生日
          </label>

          <input
            type="date"
            id="birthday"
          >

          <p class="person-form-help">
            登録するとTOPのリマインダーに表示できます
          </p>

        </div>


        <!-- 関係 -->
        <div class="person-form-group">

          <label
            for="relationship"
            class="person-form-label"
          >
            関係
          </label>

          <div class="person-select-wrapper">

            <select id="relationship">

              <option value="">
                選択してください
              </option>

              <option value="家族">
                家族
              </option>

              <option value="友人">
                友人
              </option>

              <option value="職場">
                職場
              </option>

              <option value="親戚">
                親戚
              </option>

              <option value="その他">
                その他
              </option>

            </select>

            <i class="fa-solid fa-chevron-down"></i>

          </div>

        </div>


        <!-- 好み -->
        <section class="person-info-card">

          <div class="person-info-heading">

            <span class="person-info-icon likes">
              <i class="fa-solid fa-heart"></i>
            </span>

            <div>
              <h2>好み</h2>
              <p>
                プレゼント選びの参考になる情報
              </p>
            </div>

          </div>


          <div class="person-form-group">

            <label
              for="likes"
              class="person-form-label"
            >
              好きなもの
            </label>

            <textarea
              id="likes"
              rows="3"
              placeholder="例: コーヒー、猫、チョコレート、水色"
            ></textarea>

          </div>


          <div class="person-form-group">

            <label
              for="dislikes"
              class="person-form-label"
            >
              苦手なもの・避けたいもの
            </label>

            <textarea
              id="dislikes"
              rows="3"
              placeholder="例: 和菓子、香りの強いもの"
            ></textarea>

          </div>

        </section>


        <!-- =========================
              ALLERGIES
        ========================== -->
        <div class="person-form-group">

          <label class="person-form-label">
            アレルギー情報
          </label>

          <div class="allergy-checkbox-grid">

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="卵"
              >
              <span>卵</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="乳"
              >
              <span>乳</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="小麦"
              >
              <span>小麦</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="えび"
              >
              <span>えび</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="かに"
              >
              <span>かに</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="そば"
              >
              <span>そば</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="落花生"
              >
              <span>落花生</span>
            </label>

            <label class="allergy-checkbox-item">
              <input
                type="checkbox"
                name="allergy"
                value="くるみ"
              >
              <span>くるみ</span>
            </label>

          </div>

        </div>


        <!-- その他 -->
        <div class="person-form-group">

          <label
            for="allergies-other"
            class="person-form-label"
          >
            その他のアレルギー
          </label>

          <input
            type="text"
            id="allergies-other"
            placeholder="例：キウイ、桃"
          >

        </div>


        <!-- メモ -->
        <div class="person-form-group">

          <label
            for="memo"
            class="person-form-label"
          >
            メモ
          </label>

          <textarea
            id="memo"
            rows="4"
            placeholder="例: 最近コーヒーにハマっている、猫を飼い始めた"
          ></textarea>

        </div>


        <!-- MESSAGE -->
        <p
          id="message"
          class="person-form-message"
        ></p>


        <!-- SAVE -->
        <button
          type="submit"
          class="person-submit-button"
        >
          登録する
        </button>

      </form>

    </main>

  </div>


  <script
    type="module"
    src="js/person.js"
  ></script>

</body>

</html>
